<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password - Design Thread</title>
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-color: #0d0a1a;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .brand {
      position: fixed;
      top: 30px;
      width: 100%;
      text-align: center;
      z-index: 10;
    }

    .brand p {
      font-size: 11px;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .brand h1 {
      font-size: 20px;
      font-weight: 400;
      letter-spacing: 8px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .card {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 380px;
      margin: 0 20px;
      padding: 40px 32px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      animation: fadeUp 0.7s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .card h2 {
      font-size: 22px;
      font-weight: 500;
      color: #fff;
      text-align: center;
      margin-bottom: 6px;
    }

    .card .sub {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      text-align: center;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 14px;
      margin-bottom: 22px;
      outline: none;
      transition: border 0.2s, background 0.2s;
    }

    input::placeholder {
      color: rgba(255,255,255,0.3);
    }

    input:focus {
      border-color: rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.13);
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid rgba(249, 244, 244, 0.3);
      background: transparent;
      color: rgb(249, 244, 244);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      margin-bottom: 16px;
      transition: all 0.3s ease;
    }

    .btn-submit:hover {
      background: #ffffff;
      color: #1a1040;
      border-color: #ffffff;
      transform: scale(1.02);
    }

    .back-link {
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      margin-top: 20px;
    }

    .back-link a {
      color: rgba(255,255,255,0.85);
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
    }

    .back-link a:hover {
      color: #fff;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
      display: none;
    }

    .message.success {
      background: rgba(52, 168, 83, 0.2);
      border: 1px solid rgba(52, 168, 83, 0.4);
      color: #34a853;
      display: block;
    }

    .message.error {
      background: rgba(234, 67, 53, 0.2);
      border: 1px solid rgba(234, 67, 53, 0.4);
      color: #ea4335;
      display: block;
    }

  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="brand">
    <p>Welcome to</p>
    <h1>Design Thread</h1>
  </div>

  <div class="card">
    <h2>Reset Password</h2>
    <p class="sub">Enter your email address and we'll send you a link to reset your password.</p>

    <div id="message" class="message"></div>

    <label>Email address</label>
    <input type="email" id="email" placeholder="you@example.com" />

    <button class="btn-submit" onclick="handleForgotPassword()">Send Reset Link</button>

    <p class="back-link">
      <a onclick="window.location.href='./loginpage.html'">Back to Login</a>
    </p>
  </div>

  <!-- Forgot Password & Particle Animation Handler -->
  <script type="module" src="./forgot-password.js" defer></script>

</body>
</html>
